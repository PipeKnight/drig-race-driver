[package]
name = "grid-tools"
default-run = "grid-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Validation only: hardware RCPPS/RSQRTPS on x86 instead of the default grid_world::sse_approx.
hw-sse = ["grid-world/hw-sse"]

[dependencies]
grid-formats = { path = "../grid-formats" }
grid-world = { path = "../grid-world" }
# Per-car work on Bevy's compute pool, shared with grid-app (docs/PERFORMANCE.md).
bevy_tasks = { version = "=0.19.1", default-features = false, features = ["multi_threaded"] }
