[package]
name = "grid-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
grid-formats = { path = "../grid-formats" }
grid-tools = { path = "../grid-tools" }
grid-world = { path = "../grid-world" }
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui_bevy_render", "bevy_audio", "dds", "png", "pbr_clustered_decals"] }
# Timestamp queries for the frame split (src/frame_split.rs); the version
# Bevy 0.19.1 uses.
wgpu = { version = "=29.0.4", default-features = false }

# Android (P9, docs/ANDROID.md): GameActivity loads libgrid_android.so, built
# by tools/build_android.ps1 with `cargo ndk ... build --lib`. src/lib.rs is
# empty on every other target; the desktop program stays the grid-app binary.
[lib]
name = "grid_android"
crate-type = ["cdylib"]

[features]
# Optional Windows/Linux Vulkan/RTX SDK path; ordinary and phone builds stay independent.
dlaa = ["bevy/dlss"]
# Optional material experiment; keep additional sampler bindings out of phone/default builds.
paint-specular = ["bevy/pbr_specular_textures"]
# Bounded source-cookie projector trial; normal and phone builds stay independent.
source-projector = ["bevy/pbr_light_textures"]
# Per-system Chrome trace of a run (docs/PERFORMANCE.md): build with
# `--features trace`, run with TRACE_CHROME=PATH.json. Rebuilds Bevy.
trace = ["bevy/trace_chrome"]
# On-device per-system profile tables in the log (docs/PERFORMANCE.md "Phone
# bisection"); a separate APK, since Bevy's spans cost time. Rebuilds Bevy.
profile = ["bevy/trace", "bevy/debug"]

[[bin]]
name = "grid-app"
path = "src/main.rs"

# Page faults per fixed tick (fixed_ticks.rs) and the Android calls.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["android-game-activity"] }
# Calls MainActivity (log file, error screen) from android.rs; the version
# cpal already uses on Android.
jni = "0.21"
# Tilt sensor (P11): ASensorManager through the NDK, the version android-activity uses.
ndk-sys = "0.6"
