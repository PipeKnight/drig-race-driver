[package]
name = "grid-probes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# One-off research probes moved out of grid-tools (docs/TOOLCHAIN.md, "Build
# and test cost"). Same binary names and outputs; not a default member, so
# `cargo build` and `cargo test` at the root skip them. Build with
# `cargo build --release -p grid-probes [--bin NAME]`.
autotests = false
autobenches = false

[features]
# Validation only: forwards grid-tools' hardware RCPPS/RSQRTPS switch.
hw-sse = ["grid-tools/hw-sse"]

[dependencies]
grid-formats = { path = "../grid-formats" }
grid-world = { path = "../grid-world" }
grid-tools = { path = "../grid-tools" }
# The game's gamepad backend (bevy_gilrs uses gilrs 0.11), for grid-pad-probe.
gilrs = "0.11"
# Its window for the guided test (the version Bevy uses).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# Every probe: no unit-test harness (none has a #[test]). A new probe works
# without an entry here; add one to keep `cargo test --workspace` lean.

[[bin]]
name = "grid-assisted-steering"
path = "src/bin/grid-assisted-steering.rs"
test = false

[[bin]]
name = "grid-assists-drive"
path = "src/bin/grid-assists-drive.rs"
test = false

