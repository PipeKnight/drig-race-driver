name: Fixed gameplay scenarios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Run and report fixed scenarios
        shell: bash
        run: |
          python3 -I tools/scenario_progress.py --json scenario-progress.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the machine-readable report
        if: ${{ !cancelled() && hashFiles('scenario-progress.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-progress
          path: scenario-progress.json
          if-no-files-found: error
