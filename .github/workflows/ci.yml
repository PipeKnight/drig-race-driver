# CI: the checks that need no GRID game data (docs/TOOLCHAIN.md, "Continuous integration").
# Local equivalent: the Clippy step and `cargo t` of tools\prepush.ps1's workspace tier, without
# `--include-ignored`: the tests that read the game data are #[ignore = "requires ..."] and are
# skipped. No game data, keys or secrets are used here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (Clippy, tests without game data)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bevy's Linux libraries: ALSA (bevy_audio), udev (gilrs), Wayland and xkbcommon (winit).
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # rustup reads rust-toolchain.toml (channel and components).
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc -vV
          cargo clippy -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache; pull requests reuse it (the 10 GB repository limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A failed test must not throw away the 18-minute compile.
          cache-on-failure: true
      - name: Clippy (workspace, -D warnings)
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      # sse_approx's hardware comparison runs only on Intel CPUs (docs/TOOLCHAIN.md).
      - name: Runner CPU
        run: lscpu | grep -E 'Vendor ID|Model name'
      # `cargo t` (.cargo/config.toml): test --workspace --release --lib --test * --bin grid-app.
      - name: Tests without game data
        run: cargo t --no-fail-fast

  windows:
    name: Windows (Clippy)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc -vV
          cargo clippy -V
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy (workspace, -D warnings)
        run: cargo clippy --release --workspace --all-targets -- -D warnings
