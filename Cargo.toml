[workspace]
members = ["crates/grid-formats", "crates/grid-world", "crates/grid-tools", "crates/grid-app", "crates/grid-probes"]
# grid-probes (one-off research probes) builds only when named: `-p grid-probes`
# or `--workspace` (docs/TOOLCHAIN.md, "Build and test cost").
default-members = ["crates/grid-formats", "crates/grid-world", "crates/grid-tools", "crates/grid-app"]
resolver = "3"
# Vendored, patched upstream crates (third_party/README.md); not workspace members.
exclude = ["third_party"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "GPL-3.0-or-later"

# Smaller debug builds (docs/DISK_USAGE.md §7): line tables for our crates, no
# debug info for dependencies. Generated code and determinism are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Soak builds: release speed with integer overflow checks and debug assertions
# (grid-soak, docs/SOAK_TESTING.md).
[profile.soak]
inherits = "release"
overflow-checks = true
debug-assertions = true

# DRIG patch (F875): bevy_render 0.19.1 uploads a batch set's bin buffers only
# when they changed (third_party/README.md).
[patch.crates-io]
bevy_render = { path = "third_party/bevy_render" }
# DRIG patch (F886): wgpu-core 29.0.4 merges and init-checks a bind group once per
# render pass (third_party/README.md).
wgpu-core = { path = "third_party/wgpu-core" }
# DRIG patch (F874): bevy_pbr 0.19.1 keeps GPU preprocessing and generated
# environment-map bind groups while their inputs are unchanged (third_party/README.md).
bevy_pbr = { path = "third_party/bevy_pbr" }
# DRIG patch (F927): wgpu-hal 29.0.4 and bevy_core_pipeline 0.19.1 add a Vulkan
# swapchain pre-rotation test switch, off by default (third_party/README.md).
wgpu-hal = { path = "third_party/wgpu-hal" }
bevy_core_pipeline = { path = "third_party/bevy_core_pipeline" }
