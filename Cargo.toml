[workspace]
members = ["crates/grid-formats", "crates/grid-world", "crates/grid-tools", "crates/grid-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

# Soak builds: release speed with integer overflow checks and debug assertions
# (grid-soak, docs/SOAK_TESTING.md).
[profile.soak]
inherits = "release"
overflow-checks = true
debug-assertions = true
