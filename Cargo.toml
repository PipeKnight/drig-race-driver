[workspace]
members = ["crates/grid-formats", "crates/grid-world", "crates/grid-tools", "crates/grid-app", "crates/grid-probes"]
# grid-probes (one-off research probes) builds only when named: `-p grid-probes`
# or `--workspace` (docs/TOOLCHAIN.md, "Build and test cost").
default-members = ["crates/grid-formats", "crates/grid-world", "crates/grid-tools", "crates/grid-app"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

# Smaller debug builds (docs/DISK_USAGE.md §7): line tables for our crates, no
# debug info for dependencies. Generated code and determinism are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Soak builds: release speed with integer overflow checks and debug assertions
# (grid-soak, docs/SOAK_TESTING.md).
[profile.soak]
inherits = "release"
overflow-checks = true
debug-assertions = true
