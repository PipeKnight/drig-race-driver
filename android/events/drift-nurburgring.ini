# Event profile of the bundled APK (docs/ANDROID.md "Events in the bundled
# APK"): written as event.ini next to settings.ini and replaced on every
# install; settings.ini (the owner's, kept across installs) is read after it
# and wins. Only the event menu's starting choice is set here, so a Race or
# Time Trial picked in the menu gets no drift keys.
# Drift Battle at the Nurburgring sprint layout (route_1) with seven AI BMWs,
# as settings/drift-battle-nurburgring.ini (the drift route with the best AI
# drift results, F367/F389).
# F451: the menu starts here once after each install (event.ini newer than
# event-menu.ini); editing this file changes the bundle version, so an
# update copies it again.
[event]
type = drift_battle
route = tracks/europe/nurburgring/route_1
car = bmw
laps = 2
opponents = 7
