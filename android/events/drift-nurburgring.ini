# Event profile of the bundled APK (docs/ANDROID.md "Events"): written as
# event.ini next to settings.ini and replaced on every install; settings.ini
# (the owner's, kept across installs) is read after it and wins.
# Drift Battle at the Nurburgring sprint layout with seven AI BMWs, the same
# event as settings/drift-battle-nurburgring.ini (the drift route with the
# best AI drift results, F367/F389).
[game]
route = tracks/europe/nurburgring/route_1
car = bmw
opponent_cars = bmw
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = back
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
