# Event profile of the bundled APK (docs/ANDROID.md "Events in the bundled
# APK"): written as event.ini next to settings.ini and replaced on every
# install; settings.ini (the owner's, kept across installs) is read after it
# and wins. Only the event menu's starting choice is set here.
# The Viper race at Washington route 0 (F615): the Dodge Viper against 11 AI
# Vipers, 3 laps, the setup the owner saw in car-series' speech renders. Every
# bundle carries its data; this profile only makes the menu start on it.
[event]
type = race_viper
route = tracks/usa/washington/route_0
car = vip
laps = 3
opponents = 11
