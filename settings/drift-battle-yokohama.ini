# Drift Battle (docs/DISCIPLINES.md) on Yokohama Docks yoko_v1 (route_0), the first round of the
# career drift_b_champ [D] (3 laps there): two laps with 7 AI cars, every
# car scored by the original's drift scorer, results ordered by drift points.
# Laps and the BMW field as settings/drift-battle.ini (AUTHORED).
[game]
route = tracks/japan/yokohama_docks/route_0
car = bmw
opponent_cars = bmw
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
