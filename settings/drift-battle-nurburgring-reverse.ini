# Drift Battle (docs/DISCIPLINES.md) on the Nurburgring sprint layout reversed (nurburgring_spr_r, route_3), a reverse
# route of the original's Drift Battle free-race pool [D]: two laps with 7 AI cars,
# every car scored by the original's drift scorer, results ordered by drift points.
# Laps and the BMW field as settings/drift-battle.ini (AUTHORED).
[game]
route = tracks/europe/nurburgring/route_3
car = bmw
opponent_cars = bmw
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
