# Three-lap Jarama race: the player and 11 AI opponents, starting from
# the back of the grid (the race profile on the fifth circuit, docs/JARAMA.md).
[game]
route = tracks/europe/jarama/route_1
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
