# Three-lap Spa-Francorchamps race (the 7.0 km Grand Prix circuit): the player
# and 11 AI opponents from the back of the grid (seventh circuit, docs/SPA.md).
[game]
route = tracks/europe/spa_francorchamps/route_0
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
