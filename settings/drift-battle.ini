# Drift Battle (docs/DISCIPLINES.md): two laps of the Long Beach drift
# circuit (longbeach_cl, route_1) with 7 AI cars, the free-race Drift Battle
# field size [D]; every car is scored by the original's drift scorer and the
# results are ordered by drift points. The BMW 320si is the rear-wheel-drive
# car of the two (AUTHORED choice; the original uses its drift cars).
[game]
route = tracks/usa/long_beach/route_1
car = bmw
opponent_cars = bmw
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
