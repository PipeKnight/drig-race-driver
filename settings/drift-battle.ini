# Drift Battle (docs/DISCIPLINES.md): two laps of the Long Beach drift
# circuit (longbeach_cl, route_1) with 7 AI cars, the free-race Drift Battle
# field size [D]; every car is scored by the original's drift scorer and the
# results are ordered by drift points. The field is drawn from the original's
# drift_battle pool of drift cars like a free race (docs/SERIES.md); the
# player's Nissan Silvia is an AUTHORED choice from that pool.
# The player's grid slot is drawn at random, the original's Race Options
# default (docs/EVENT_MENU.md).
[game]
series = drift_battle
route = tracks/usa/long_beach/route_1
car = s15
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = random
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
