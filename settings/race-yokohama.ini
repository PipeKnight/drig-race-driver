# Three-lap Yokohama Docks race (yoko_v1, the Japan Street GT layout): the player
# and 11 AI opponents from the back of the grid (sixth circuit, docs/YOKOHAMA.md).
[game]
route = tracks/japan/yokohama_docks/route_0
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
