# Pro Touge (docs/TOUGE.md section 7): Haruna route 1 (haruna_ill_mid_bot)
# against one AI car, two runs: downhill, then uphill (the reverse subroute)
# with the grid slots swapped. Collision penalties from gameconfig/touge.xml
# (minor 2 s, major 10 s) are added to each run; the results order by total
# time (Round 1, Round 2, Total Times). Lacetti as on the circuits (AUTHORED).
[game]
route = tracks/japan/haruna/route_1
[drive]
enabled = on
discipline = pro_touge
laps = 1
opponents = 1
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = touge
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
