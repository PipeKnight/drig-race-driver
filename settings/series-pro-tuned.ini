# Pro Tuned free race on Donington National (route_1), docs/SERIES.md: the
# series' cars and the original's free-race grid fill (12 cars: Supra,
# Skyline, NSX-R and 350Z in blocks of three; the player takes one entry).
# Any layout of the pro_tuned pool on our circuits works as `route`, e.g.
# tracks/europe/nurburgring/route_3 (Nurburgring sprint reverse) or
# tracks/usa/long_beach/route_2 (Long Beach sprint).
[game]
series = pro_tuned
route = tracks/europe/donington/route_1
car = sup
[drive]
enabled = on
laps = 3
grid_position = back
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
