# Three-lap Istanbul Park race: the player and 11 AI opponents, starting from
# the back of the grid (the race profile on the third circuit, docs/ISTANBUL_PARK.md).
[game]
route = tracks/europe/istanbul_park/route_0
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
