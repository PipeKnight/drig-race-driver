# Freestyle drift (docs/DISCIPLINES.md, docs/TOUGE.md section 4): the player
# alone in the Yokohama arena yoko_drift_1 (route_3) for 90 s (the career
# time [D]), scored by the drift scorer with race progress ignored ([V] the
# drift_freestyle format sets drift settings +0x1C8). No lap timing, no AI.
# BMW 320si as in the other drift events (AUTHORED choice).
[game]
route = tracks/japan/yokohama_docks/route_3
car = bmw
[drive]
enabled = on
discipline = drift_freestyle
time_limit = 90
[ai]
difficulty = 0.606
[private]
body_contacts = derive
body_events = derive
deformation = derive
