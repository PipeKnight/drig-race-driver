# Le Mans 24 Hours on Circuit de la Sarthe (route_0), docs/LE_MANS.md: the
# free race `Le_Mans` as the career's GT1 event: a time-limited race of 720 s
# real time running 24 h of day from 15:00 (race type 3), the original's
# 24-hour field (every lemans_restrictions row of the player's car with
# lemans_24 = 1: 16 cars of four classes for the DBR9) on the class-sorted
# grid, and the class results (the LMP1 Audi R10s race since F420).
[game]
series = le_mans
route = tracks/europe/le_mans/route_0
car = dbr
[drive]
enabled = on
laps = 8
time_limit = 720
grid_position = back
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
