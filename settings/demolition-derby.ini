# Demolition Derby (docs/DEMOLITION_DERBY.md): the career event Western_states_D
# (Michigan Demolition Derby) on the Detroit stadium, detroit_stad_L (route_8),
# six laps [D], the player and 11 AI stock cars (stk) from the back of the
# grid. A flipped player and AI cars that stop for 10 s are disqualified
# (gameconfig/demolition_derby.xml, 0x60D590, 0x630CF0). Set route_9 for the
# short stadium (detroit_stad_s).
[game]
route = tracks/usa/detroit/route_8
car = stk
opponent_cars = stk
[drive]
enabled = on
discipline = demolition_derby
laps = 6
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
