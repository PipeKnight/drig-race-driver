# Drift GP (docs/DISCIPLINES.md): two laps of the Long Beach drift circuit
# (longbeach_cl, route_1) alone on the track; the rival is virtual, its score
# estimated by the original's virtual race from the route's free-race Drift GP
# base result (2 cars, 1,890,000 [D]). Scored by the drift scorer without the
# Drift Battle position multiplier. The car is from the original's drift_gp
# pool of drift cars (docs/SERIES.md); the Nissan Silvia is an AUTHORED choice
# from that pool, with the default setup every car races with.
[game]
route = tracks/usa/long_beach/route_1
car = s15
[drive]
enabled = on
discipline = drift_grand_prix
laps = 2
[ai]
difficulty = 0.606
[private]
body_contacts = derive
body_events = derive
deformation = derive
