# Drift Battle (docs/DISCIPLINES.md) on the Istanbul Park intermediate layout (istanbul_int, route_1), a route of
# the original's Drift Battle free-race pool [D]: two laps with 7 AI cars, every
# car scored by the original's drift scorer, results ordered by drift points.
# Laps and the player's Silvia as settings/drift-battle.ini (AUTHORED); the
# field is drawn from the drift_battle pool (docs/SERIES.md).
[game]
series = drift_battle
route = tracks/europe/istanbul_park/route_1
car = s15
[drive]
enabled = on
discipline = drift_battle
laps = 2
opponents = 7
grid_position = random
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
