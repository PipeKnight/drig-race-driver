# Three-lap race: the player and 11 AI opponents (the original's 12 touring
# cars), starting from the back of the grid.
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = body-contact-directions.bin
body_events = derive
deformation = derive
