# Touge run (docs/TOUGE.md): Haruna route 1 (haruna_ill_mid_bot, the mountain
# road from the middle to the bottom, 5.86 km) downhill against one AI car from
# the two-car standing grid. One run from the start gate to the finish gate.
# The original's two-run Pro Touge rules and penalties are not ported; set
# subroute = 1 for the run uphill. Lacetti as on the circuits (AUTHORED; the
# original's touge cars are not ported).
[game]
route = tracks/japan/haruna/route_1
subroute = 0
[drive]
enabled = on
laps = 1
opponents = 1
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = touge
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
