# Two-lap race on Circuit de la Sarthe (route_0, 13.6 km): the player and 11
# AI opponents, starting from the back of the grid (the race profile on the
# seventh circuit, docs/LE_MANS.md).
[game]
route = tracks/europe/le_mans/route_0
[drive]
enabled = on
laps = 2
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
