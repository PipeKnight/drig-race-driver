# Three-lap Long Beach race: the player and 11 AI opponents, starting from
# the back of the grid (the race profile on the fourth circuit, docs/LONG_BEACH.md).
[game]
route = tracks/usa/long_beach/route_0
[drive]
enabled = on
laps = 3
opponents = 11
grid_position = back
# Used when the private table exists in the data dir.
ai_characteristics = ai-driver-characteristics.tsv
# AI pacing (catch-up, choreographer, mistakes); these are the defaults.
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = body-contact-directions.bin
body_events = derive
deformation = derive
