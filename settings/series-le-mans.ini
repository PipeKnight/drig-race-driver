# Le Mans Series free race on the Donington GP (route_0), docs/SERIES.md: the
# original's field (every lemans_restrictions row of the player's car, 15-17
# cars of four classes) and its grid (classes LMP1, LMP2, GT1, GT2 from the
# front, shuffled inside each class; the player at the back of its class).
# The fields include Courage LC70 prototypes, which still ground at speed
# (experimental: the launcher sets GRID_SERIES_EXPERIMENTAL=1).
[game]
series = le_mans_series
route = tracks/europe/donington/route_0
car = dbr
[drive]
enabled = on
laps = 3
grid_position = back
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = rd_3_star
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
