# Build gate memory-growth race (tools/build_gate.ps1, docs/TOOLCHAIN.md "Build gate"):
# settings/race.ini (Donington, the player and 11 AI Lacettis from the back) with 12 laps,
# so the race outlasts the gate's 10 minutes of driving. Every car's engine, tyre and
# HUD sounds play (F482's leak grew 4.8 MB/s with 12 cars; the Le Mans 24 Hours field has
# no engine sound, F516). A pile-up can still slow it (full-3: 134 prop bodies, 49.7
# ticks/s); the run stops on the wall clock, so the slope still covers 8 minutes.
[game]
route = tracks/europe/donington/route_0
car = lac
[drive]
enabled = on
laps = 12
opponents = 11
grid_position = back
ai_characteristics = ai-driver-characteristics.tsv
[ai]
difficulty = 0.606
catchup = on
choreographer = on
mistakes = on
[private]
body_contacts = derive
body_events = derive
deformation = derive
